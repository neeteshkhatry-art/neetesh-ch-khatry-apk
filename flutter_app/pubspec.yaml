name: daily_life_manager
description: "Daily Life Manager - Personal finance, expense & income tracking, budget alerts, and diet nutrition tracking with SQLite offline storage."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.2
  local_auth: ^2.1.8
  googleapis: ^13.0.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
